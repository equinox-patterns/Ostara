name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à construire'
        type: choice
        default: all
        options: [all, macos, windows, linux]

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      # Homebrew ne livre que l'arm64 du runner : pour x86_64 la bibliothèque est compilée
      # depuis les sources, avec la même architecture et le même minimum macOS que l'app.
      - name: xerces-c
        run: |
          curl -fsSL -o xerces.tar.gz https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.3.0.tar.gz
          tar xf xerces.tar.gz
          cmake -S xerces-c-3.3.0 -B xerces-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/xerces-install" \
            -DBUILD_SHARED_LIBS=ON \
            -Dnetwork=OFF
          cmake --build xerces-build --parallel "$(sysctl -n hw.ncpu)"
          cmake --install xerces-build

      - name: Configurer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$PWD/xerces-install"

      - name: Compiler
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/src/app/ostara/ostara_fr_FR.qm -o /tmp/ostara_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/ostara_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: Empaqueter
        run: |
          cmake --install build --prefix stage
          mkdir -p dmg
          cp -R stage/Ostara.app dmg/
          ln -s /Applications dmg/Applications
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname Ostara -srcfolder dmg -ov -format UDZO \
            "Ostara-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: '*.dmg'

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ..\Trame

      - name: zlib et xerces
        run: vcpkg install zlib:x64-windows xerces-c:x64-windows

      - name: Configurer
        run: >-
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Compiler
        run: cmake --build build --config Release --parallel 2

      - name: Traductions Qt dans le catalogue
        shell: pwsh
        run: |
          $qm = "build\src\app\ostara\ostara_fr_FR.qm"
          & "$env:QT_ROOT_DIR\bin\lconvert.exe" -i $qm -o check_fr.ts
          if (-not (Select-String -Path check_fr.ts -Pattern "<source>&amp;Cancel</source>" -Quiet)) {
            throw "Traductions Qt absentes : les dialogues natifs resteraient en anglais"
          }

      - name: Empaqueter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "build\src\app\ostara\Release\Ostara.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem -Recurse -Filter Ostara.exe build | Select-Object -First 1
            if (-not $found) { throw "Ostara.exe introuvable dans build" }
            $exe = $found.FullName
          }
          Copy-Item $exe dist\Ostara.exe
          Copy-Item NOTICE, COPYRIGHT.md, AUTHORS.txt, LICENSE dist\
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item share\licenses\*.txt dist\licenses\
          # xerces et zlib sont copiés à côté du binaire par CMake, pas dans dist :
          # sans eux l'exe ne démarre pas sur une machine vierge.
          Copy-Item (Join-Path (Split-Path $exe) "*.dll") dist\
          windeployqt --release --no-translations --compiler-runtime dist\Ostara.exe
          # windeployqt ne trouve pas le CRT hors invite de commandes VS (VCINSTALLDIR vide),
          # il saute --compiler-runtime sans rien dire. On copie le redistribuable à la main.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crtDll = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Recurse -Filter vcruntime140.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $crtDll) { throw "CRT x64 introuvable dans le redistribuable Visual Studio" }
          Copy-Item (Join-Path $crtDll.Directory.FullName "*.dll") dist\
          if (-not (Test-Path dist\vcruntime140.dll)) { throw "CRT MSVC absent de dist" }
          if (-not (Test-Path dist\xerces-c_3_3.dll)) { throw "xerces absent de dist" }
          choco install nsis -y --no-progress
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          & "C:\Program Files (x86)\NSIS\makensis.exe" "-DVERSION=$version" "-DDIST=$PWD\dist" "-DOUTDIR=$PWD" packaging\windows\installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: '*.exe'

  linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          cache: true

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxerces-c-dev librsvg2-bin

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --parallel "$(nproc)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/src/app/ostara/ostara_fr_FR.qm -o /tmp/ostara_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/ostara_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: AppImage
        run: |
          mkdir -p AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          rsvg-convert -w 512 -h 512 share/icons/app/Ostara.svg -o Ostara.png
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir -e AppDir/usr/bin/Ostara \
            -d share/ostara.desktop -i Ostara.png --plugin qt --output appimage
          VERSION="${GITHUB_REF_NAME#v}"
          mv Ostara*.AppImage "Ostara-${VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: '*.AppImage'
