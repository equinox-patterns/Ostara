name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à construire'
        type: choice
        default: all
        options: [all, macos, windows, linux]
      # Permet de reconstruire un paquet sans déplacer ni recréer d'étiquette : le
      # numéro inscrit dans l'installeur Windows vient du nom de la référence Git
      # (« v1.1.0 » → « 1.1.0 »), donc un lancement depuis une branche inscrirait le
      # nom de la branche dans le registre Windows. Vide = comportement d'origine.
      version:
        description: 'Version à inscrire dans le paquet Windows (défaut : depuis le tag ou la branche)'
        required: false

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple-Silicon
          - arch: x86_64
            label: Intel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      # Homebrew ne livre que l'arm64 du runner : pour x86_64 la bibliothèque est compilée
      # depuis les sources, avec la même architecture et le même minimum macOS que l'app.
      - name: xerces-c
        run: |
          curl -fsSL -o xerces.tar.gz https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.3.0.tar.gz
          tar xf xerces.tar.gz
          cmake -S xerces-c-3.3.0 -B xerces-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/xerces-install" \
            -DBUILD_SHARED_LIBS=ON \
            -Dnetwork=OFF
          cmake --build xerces-build --parallel "$(sysctl -n hw.ncpu)"
          cmake --install xerces-build

      - name: Configurer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_PREFIX_PATH="$PWD/xerces-install"

      - name: Compiler
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/src/app/ostara/ostara_fr_FR.qm -o /tmp/ostara_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/ostara_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: Empaqueter
        run: |
          cmake --install build --prefix stage
          mkdir -p dmg
          cp -R stage/Ostara.app dmg/
          ln -s /Applications dmg/Applications
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname Ostara -srcfolder dmg -ov -format UDZO \
            "Ostara-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: '*.dmg'

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ..\Trame

      - name: zlib et xerces
        run: vcpkg install zlib:x64-windows xerces-c:x64-windows

      - name: Configurer
        run: >-
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Compiler
        run: cmake --build build --config Release --parallel 2

      - name: Traductions Qt dans le catalogue
        shell: pwsh
        run: |
          $qm = "build\src\app\ostara\ostara_fr_FR.qm"
          & "$env:QT_ROOT_DIR\bin\lconvert.exe" -i $qm -o check_fr.ts
          if (-not (Select-String -Path check_fr.ts -Pattern "<source>&amp;Cancel</source>" -Quiet)) {
            throw "Traductions Qt absentes : les dialogues natifs resteraient en anglais"
          }

      - name: Empaqueter
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "build\src\app\ostara\Release\Ostara.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem -Recurse -Filter Ostara.exe build | Select-Object -First 1
            if (-not $found) { throw "Ostara.exe introuvable dans build" }
            $exe = $found.FullName
          }
          Copy-Item $exe dist\Ostara.exe
          Copy-Item NOTICE, COPYRIGHT.md, AUTHORS.txt, LICENSE dist\
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item share\licenses\*.txt dist\licenses\
          # xerces et zlib sont copiés à côté du binaire par CMake, pas dans dist :
          # sans eux l'exe ne démarre pas sur une machine vierge.
          Copy-Item (Join-Path (Split-Path $exe) "*.dll") dist\
          # VPropertyExplorerLib et QMUParserLib sont des DLL construites dans leur
          # propre dossier : l'exe les importe, elles n'étaient jamais copiées.
          Get-ChildItem -Recurse -Path build -Filter *.dll |
            Where-Object { $_.DirectoryName -like "*\Release" } |
            ForEach-Object { Copy-Item $_.FullName dist\ -Force }
          windeployqt --release --no-translations --compiler-runtime dist\Ostara.exe
          # windeployqt ne trouve pas le CRT hors invite de commandes VS (VCINSTALLDIR vide),
          # il saute --compiler-runtime sans rien dire. On copie le redistribuable à la main.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          # Le dossier VC\Redist\MSVC contient plusieurs générations (14.29 = VS2019,
          # 14.30 et au-delà = VS2022) et Get-ChildItem les rend dans l'ordre
          # alphabétique : « -First 1 » prenait donc la PLUS ANCIENNE. L'app, Xerces et
          # Qt étant compilés avec le CRT de VS2022, ils en trouvaient un de VS2019 à
          # l'exécution. En v1.1.0 cela tuait Ostara au démarrage sur tout Windows :
          # lecture d'adresse nulle dans msvcp140 pendant XMLPlatformUtils::Initialize,
          # code 0xC0000005, avant même que le journal existe. Rabnest y échappait
          # seulement parce qu'il n'appelle jamais Xerces.
          # FileVersion arrive sous la forme « 14.29.30157.0 built by: cloudtest » :
          # seul le premier mot est convertible en [version], le reste fait échouer le
          # tri. On isole donc le numéro avant de comparer.
          #
          # Le chemin est ancré sur « <version>\x64\Microsoft.VC14x.CRT\ » : à côté du
          # CRT du bureau, le redistribuable contient aussi « onecore\x64\… » (sous-
          # ensemble d'API OneCore) et « spectre\x64\… » (bibliothèques atténuées pour
          # /Qspectre). Un simple « \x64\ » les attrapait tous les deux.
          $crtCandidates = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Recurse -Filter vcruntime140.dll |
            Where-Object { $_.FullName -match '\\MSVC\\[0-9][0-9.]*\\x64\\Microsoft\.VC14[0-9]\.CRT\\' }
          if (-not $crtCandidates) {
            # Repli : n'importe quel x64, sauf les deux variantes ci-dessus.
            $crtCandidates = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Recurse -Filter vcruntime140.dll |
              Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch '\\(onecore|spectre)\\' }
          }
          $crtDll = $crtCandidates |
            Sort-Object { [version](($_.VersionInfo.FileVersion -split ' ')[0]) } -Descending |
            Select-Object -First 1
          if (-not $crtDll) { throw "CRT x64 introuvable dans le redistribuable Visual Studio" }
          Copy-Item (Join-Path $crtDll.Directory.FullName "*.dll") dist\
          if (-not (Test-Path dist\vcruntime140.dll)) { throw "CRT MSVC absent de dist" }
          $crtVersion = [version]((Get-Item dist\vcruntime140.dll).VersionInfo.FileVersion -split ' ')[0]
          if ($crtVersion -lt [version]'14.30') {
            throw "CRT trop ancien dans dist : $crtVersion (VS2019 = 14.29, VS2022 = 14.30+)"
          }
          # Le binaire doit démarrer : --version construit QApplication puis sort en 0.
          # Sans cette sonde, un CRT incompatible produisait quand même un installeur,
          # et la panne n'apparaissait que chez l'utilisatrice, sans message.
          $probe = Start-Process -FilePath "$PWD\dist\Ostara.exe" -ArgumentList '--version' `
            -Wait -PassThru -NoNewWindow
          if ($probe.ExitCode -ne 0) {
            throw "Ostara.exe ne démarre pas (code $($probe.ExitCode), CRT $crtVersion)"
          }
          if (-not (Test-Path dist\xerces-c_3_3.dll)) { throw "xerces absent de dist" }
          if (-not (Get-ChildItem dist -Filter "VPropertyExplorerLib.dll")) { throw "VPropertyExplorerLib.dll absent de dist" }
          if (-not (Get-ChildItem dist -Filter "QMUParserLib.dll")) { throw "QMUParserLib.dll absent de dist" }
          choco install nsis -y --no-progress
          # Le numéro vient du tag (« v1.1.0 » → « 1.1.0 »). L'entrée « version » de
          # workflow_dispatch prend le dessus quand elle est fournie, et une branche de
          # reconstruction (« rebuilt/v1.1.0 ») est comprise de la même façon : on ne
          # garde que le dernier segment, sans le « v ». Sans cela, reconstruire depuis
          # une branche inscrirait le nom de la branche dans « Ajout/Suppression de
          # programmes », puisque l'installeur tire sa version de la référence Git.
          $version = if ($env:VERSION_INPUT) {
            $env:VERSION_INPUT
          } else {
            ($env:GITHUB_REF_NAME -split '/')[-1] -replace '^v',''
          }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "-DVERSION=$version" "-DDIST=$PWD\dist" "-DOUTDIR=$PWD" packaging\windows\installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: '*.exe'

  linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          cache: true

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxerces-c-dev librsvg2-bin

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --parallel "$(nproc)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/src/app/ostara/ostara_fr_FR.qm -o /tmp/ostara_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/ostara_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: AppImage
        run: |
          mkdir -p AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          rsvg-convert -w 512 -h 512 share/icons/app/Ostara.svg -o Ostara.png
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir -e AppDir/usr/bin/Ostara \
            -d share/ostara.desktop -i Ostara.png --plugin qt
          # libgnutls est embarqué mais pas ses propres dépendances : sans elles
          # l'AppImage ne démarre pas sur une distribution minimale.
          for lib in libgmp.so.10 libgpg-error.so.0 libcom_err.so.2; do
            cp -L /usr/lib/x86_64-linux-gnu/${lib}* AppDir/usr/lib/ 2>/dev/null || true
          done
          # appimagetool veut l'icône à la racine de l'AppDir, nommée comme Icon= du .desktop
          cp -f Ostara.png AppDir/Ostara.png
          ARCH=x86_64 ./appimagetool AppDir "Ostara.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: '*.AppImage'
